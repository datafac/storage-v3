#
# Builds, tests and publishes package(s)
#

name: Build-Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    # we are running the builds and tests on Windows because we might want to build and test .NET Framework projects
    # if no .NET Framework projects are present, you can change this to ubuntu-latest to save some time and resources
    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:  
        fetch-depth: 0

    - name: Setup .NET 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: NuGet Login
      uses: NuGet/login@v1
      id: login
      with:
        user: Psiman62 # or ${{secrets.NUGET_USER}}

    - name: NuGet Push
      run: dotnet nuget push **/D*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
