#
# Builds, tests and publishes package(s)
#

name: Build-Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:  
        fetch-depth: 0

    - name: Install Mono
      run: |
        sudo apt-get update && sudo apt-get install -y mono-complete

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: NuGet Login
      uses: NuGet/login@v1
      id: login
      with:
        user: Psiman62 # or ${{secrets.NUGET_USER}}

    - name: NuGet Push
      run: dotnet nuget push **/D*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
